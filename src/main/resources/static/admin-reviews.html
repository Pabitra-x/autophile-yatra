<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reviews & Feedback - Admin</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #222;
        }

        .header {
            background: #0b3d91;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
        }

        .back-btn {
            background: white;
            color: #0b3d91;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .top-section h2 {
            color: #0b3d91;
        }

        .refresh-btn {
            background: #0b3d91;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 6px;
            display: none;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .review-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .review-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .review-card h3 {
            color: #0b3d91;
            margin-bottom: 12px;
        }

        .review-info {
            margin: 8px 0;
            line-height: 1.5;
        }

        .rating {
            font-size: 22px;
            color: #f5a623;
            margin: 10px 0;
        }

        .comment {
            background: #f4f7fb;
            padding: 12px;
            border-radius: 6px;
            margin: 12px 0;
            line-height: 1.5;
            min-height: 60px;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .delete-btn:hover {
            background: #b02a37;
        }

        .no-data {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #555;
        }

        @media (max-width: 600px) {
            .header {
                padding: 15px;
            }

            .header h1 {
                font-size: 18px;
            }

            .container {
                width: 92%;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Reviews & Feedback</h1>
        <button class="back-btn" onclick="goBack()">Back to Dashboard</button>
    </div>

    <div class="container">

        <div class="top-section">
            <h2>Customer Reviews</h2>

            <button class="refresh-btn" onclick="loadReviews()">
                Refresh Reviews
            </button>
        </div>

        <div id="message" class="message"></div>

        <div id="reviewsContainer">
            <div class="loading">
                Loading reviews...
            </div>
        </div>

    </div>

    <script>

        // Admin login check
        const adminId = sessionStorage.getItem("adminId");

        if (!adminId) {
            alert("Please login as admin first.");
            window.location.href = "/admin-login.html";
        }

        function goBack() {
            window.location.href = "/admin-dashboard.html";
        }

        function showMessage(message, type) {

            const messageBox = document.getElementById("message");

            messageBox.innerText = message;
            messageBox.className = "message " + type;
            messageBox.style.display = "block";

            setTimeout(function () {
                messageBox.style.display = "none";
            }, 3000);
        }

        function createStars(rating) {

            let stars = "";

            const ratingNumber = Number(rating) || 0;

            for (let i = 1; i <= 5; i++) {

                if (i <= ratingNumber) {
                    stars += "★";
                } else {
                    stars += "☆";
                }
            }

            return stars;
        }

        async function loadReviews() {

            const container = document.getElementById("reviewsContainer");

            container.innerHTML = `
                <div class="loading">
                    Loading reviews...
                </div>
            `;

            try {

                const response = await fetch("/api/reviews/all");

                if (!response.ok) {
                    throw new Error("Unable to load reviews");
                }

                const reviews = await response.json();

                if (!reviews || reviews.length === 0) {

                    container.innerHTML = `
                        <div class="no-data">
                            <h3>No reviews available</h3>
                            <p>Customers have not submitted any reviews yet.</p>
                        </div>
                    `;

                    return;
                }

                let html = '<div class="review-grid">';

                reviews.forEach(function (review) {

                    html += `
                        <div class="review-card">

                            <h3>
                                Review #${review.reviewId ?? "-"}
                            </h3>

                            <div class="review-info">
                                <strong>Customer ID:</strong>
                                ${review.customerId ?? "-"}
                            </div>

                            <div class="review-info">
                                <strong>Booking ID:</strong>
                                ${review.bookingId ?? "-"}
                            </div>

                            <div class="rating">
                                ${createStars(review.rating)}
                            </div>

                            <div class="review-info">
                                <strong>Rating:</strong>
                                ${review.rating ?? "-"} / 5
                            </div>

                            <div class="comment">
                                <strong>Comment:</strong><br>
                                ${escapeHtml(review.comment ?? "No comment")}
                            </div>

                            <button
                                class="delete-btn"
                                onclick="deleteReview(${review.reviewId})">
                                Delete Review
                            </button>

                        </div>
                    `;
                });

                html += "</div>";

                container.innerHTML = html;

            } catch (error) {

                console.error(error);

                container.innerHTML = `
                    <div class="no-data">
                        <h3>Unable to load reviews</h3>
                        <p>Please check the server and try again.</p>
                    </div>
                `;

                showMessage("Failed to load reviews.", "error");
            }
        }

        async function deleteReview(reviewId) {

            const confirmDelete = confirm(
                "Are you sure you want to delete this review?"
            );

            if (!confirmDelete) {
                return;
            }

            try {

                const response = await fetch(
                    "/api/reviews/" + reviewId,
                    {
                        method: "DELETE"
                    }
                );

                if (!response.ok) {
                    throw new Error("Delete failed");
                }

                showMessage(
                    "Review deleted successfully.",
                    "success"
                );

                loadReviews();

            } catch (error) {

                console.error(error);

                showMessage(
                    "Failed to delete review.",
                    "error"
                );
            }
        }

        function escapeHtml(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        loadReviews();

    </script>

</body>
</html>
