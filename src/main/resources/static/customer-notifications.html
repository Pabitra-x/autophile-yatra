<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Notifications - Autophile Yatra</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            color: white;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.45),
                    rgba(0, 0, 0, 0.45)
                ),
                url("./images/customer-dashboard-bg.png");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            width: 100%;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background: rgba(0, 0, 0, 0.50);

            backdrop-filter: blur(10px);

            border-bottom:
                1px solid rgba(255, 255, 255, 0.20);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .tagline {
            font-size: 13px;
            margin-top: 4px;
            opacity: 0.9;
        }

        .nav-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-btn,
        .logout-btn,
        .refresh-btn {
            border: none;
            padding: 11px 20px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
        }

        /* ================= DASHBOARD ================= */

        .nav-btn {
            background: white;
            color: #174f86;
        }

        .nav-btn:hover {
            background: #e5f2ff;
        }

        /* ================= LOGOUT ================= */

        .logout-btn {
            background: #dc2626;
            color: white;
        }

        .logout-btn:hover {
            background: #b91c1c;
        }

        /* ================= NOTIFICATION BADGE ================= */

        .notification-badge {
            background: #ef4444;
            color: white;

            min-width: 24px;
            height: 24px;

            padding: 2px 7px;

            border-radius: 20px;

            display: inline-flex;
            justify-content: center;
            align-items: center;

            font-size: 13px;
            font-weight: bold;
        }

        .notification-badge.hidden {
            display: none;
        }

        /* ================= REFRESH ================= */

        .refresh-btn {
            background: #2563eb;
            color: white;
            margin-top: 15px;
        }

        .refresh-btn:hover {
            background: #1d4ed8;
        }

        /* ================= MAIN ================= */

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 45px auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 40px;
            margin-bottom: 10px;

            text-shadow:
                2px 2px 5px rgba(0, 0, 0, 0.5);
        }

        .page-header p {
            font-size: 17px;

            text-shadow:
                1px 1px 4px rgba(0, 0, 0, 0.6);
        }

        /* ================= UNREAD SUMMARY ================= */

        .unread-summary {
            display: inline-block;

            margin-top: 15px;

            background: #fee2e2;
            color: #991b1b;

            padding: 8px 16px;

            border-radius: 20px;

            font-weight: bold;
            font-size: 14px;
        }

        .unread-summary.hidden {
            display: none;
        }

        /* ================= LOADING ================= */

        #loading {
            text-align: center;
            font-size: 18px;
            padding: 25px;
        }

        /* ================= NOTIFICATION CONTAINER ================= */

        #notificationContainer {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* ================= NOTIFICATION CARD ================= */

        .notification-card {
            background: rgba(255, 255, 255, 0.96);
            color: #222;

            padding: 22px;

            border-radius: 18px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.25);

            border-left: 6px solid #2563eb;
        }

        .notification-card.approved {
            border-left-color: #16a34a;
        }

        .notification-card.rejected {
            border-left-color: #dc2626;
        }

        .notification-card.trip {
            border-left-color: #7c3aed;
        }

        .notification-card.payment {
            border-left-color: #f59e0b;
        }

        .notification-card.unread-card {
            background: #fff7ed;
        }

        .notification-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
        }

        .notification-title {
            font-size: 21px;
            font-weight: bold;
            color: #174f86;
        }

        .notification-type {
            padding: 6px 12px;

            border-radius: 20px;

            background: #e0f2fe;
            color: #0369a1;

            font-size: 12px;
            font-weight: bold;
        }

        .notification-message {
            color: #444;
            line-height: 1.6;
            margin-bottom: 15px;
            font-size: 15px;
        }

        .notification-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .status {
            font-size: 13px;
            font-weight: bold;
        }

        .status.new {
            color: #dc2626;
        }

        .status.read {
            color: #16a34a;
        }

        .read-btn {
            border: none;
            padding: 9px 15px;
            border-radius: 20px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .read-btn:hover {
            background: #1d4ed8;
        }

        .delete-btn {
            border: none;
            padding: 9px 15px;
            border-radius: 20px;
            background: #dc2626;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ================= EMPTY ================= */

        .empty-box {
            background:
                rgba(255, 255, 255, 0.96);

            color: #333;

            padding: 45px 25px;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .empty-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .empty-box h2 {
            color: #174f86;
            margin-bottom: 10px;
        }

        .empty-box p {
            color: #666;
            line-height: 1.6;
        }

        /* ================= ERROR ================= */

        .error-box {
            background:
                rgba(255, 255, 255, 0.96);

            color: #333;

            padding: 35px;

            border-radius: 20px;

            text-align: center;
        }

        .error-box h2 {
            color: #dc2626;
            margin-bottom: 10px;
        }

        /* ================= FOOTER ================= */

        footer {
            text-align: center;
            margin-top: 45px;
            padding: 20px;

            background:
                rgba(0, 0, 0, 0.40);

            font-size: 14px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 700px) {

            .navbar {
                padding: 15px 20px;
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .logo {
                font-size: 22px;
            }

            .nav-buttons {
                justify-content: center;
            }

            .page-header h1 {
                font-size: 30px;
            }

            .notification-top {
                flex-direction: column;
                align-items: flex-start;
            }

            .notification-bottom {
                flex-direction: column;
                align-items: flex-start;
            }

            .action-buttons {
                width: 100%;
            }

            .read-btn,
            .delete-btn {
                width: 100%;
            }

        }

    </style>

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <div class="navbar">

        <div>

            <div class="logo">
                🚗 Autophile Yatra
            </div>

            <div class="tagline">
                Travel • Explore • Discover
            </div>

        </div>

        <div class="nav-buttons">

            <button
                type="button"
                class="nav-btn"
                onclick="goToDashboard()">

                🏠 Dashboard

            </button>

            <span
                id="navbarNotificationBadge"
                class="notification-badge hidden">

                0

            </span>

            <button
                type="button"
                class="logout-btn"
                onclick="logoutUser()">

                🚪 Logout

            </button>

        </div>

    </div>

    <!-- ================= MAIN ================= -->

    <div class="container">

        <div class="page-header">

            <h1>
                🔔 My Notifications
            </h1>

            <p>
                Booking, payment and trip updates
            </p>

            <div
                id="unreadSummary"
                class="unread-summary hidden">

                0 unread

            </div>

            <br>

            <button
                type="button"
                class="refresh-btn"
                onclick="loadNotifications()">

                🔄 Refresh Notifications

            </button>

        </div>

        <!-- LOADING -->

        <div id="loading">

            Loading notifications...

        </div>

        <!-- NOTIFICATIONS -->

        <div id="notificationContainer">
        </div>

    </div>

    <!-- ================= FOOTER ================= -->

    <footer>

        © 2026 Autophile Yatra.
        All Rights Reserved.

    </footer>

    <!-- ================= JAVASCRIPT ================= -->

    <script>

        // =====================================================
        // CUSTOMER ID
        // =====================================================

        const customerId =
            sessionStorage.getItem("customerId");

        // =====================================================
        // LOGIN CHECK
        // =====================================================

        if (!customerId) {

            window.location.replace(
                "./login.html"
            );
        }

        // =====================================================
        // GO TO DASHBOARD
        // =====================================================

        function goToDashboard() {

            window.location.replace(
                "./customer-dashboard.html"
            );

        }

        // =====================================================
        // LOGOUT
        // =====================================================

        function logoutUser() {

            sessionStorage.removeItem(
                "customerId"
            );

            sessionStorage.removeItem(
                "customerMobile"
            );

            sessionStorage.removeItem(
                "trackingBookingId"
            );

            window.location.replace(
                "./login.html"
            );

        }

        // =====================================================
        // LOAD NOTIFICATIONS
        // =====================================================

        async function loadNotifications() {

            const loading =
                document.getElementById(
                    "loading"
                );

            const container =
                document.getElementById(
                    "notificationContainer"
                );

            loading.style.display =
                "block";

            container.innerHTML = "";

            try {

                const response =
                    await fetch(
                        "/api/notifications/customer/"
                        + encodeURIComponent(
                            customerId
                        )
                    );

                const responseText =
                    await response.text();

                if (!response.ok) {

                    throw new Error(
                        responseText ||
                        "Unable to load notifications."
                    );
                }

                const notifications =
                    JSON.parse(responseText);

                loading.style.display =
                    "none";

                displayNotifications(
                    notifications
                );

                updateUnreadCount(
                    notifications
                );

            }
            catch (error) {

                console.error(
                    "Notification Error:",
                    error
                );

                loading.style.display =
                    "none";

                container.innerHTML = `

                    <div class="error-box">

                        <h2>
                            ⚠️ Error Loading Notifications
                        </h2>

                        <p>
                            ${escapeHtml(
                                error.message
                            )}
                        </p>

                        <br>

                        <button
                            type="button"
                            class="refresh-btn"
                            onclick="loadNotifications()">

                            🔄 Try Again

                        </button>

                    </div>

                `;

            }

        }

        // =====================================================
        // UPDATE UNREAD COUNT
        // =====================================================

        function updateUnreadCount(
            notifications
        ) {

            const badge =
                document.getElementById(
                    "navbarNotificationBadge"
                );

            const summary =
                document.getElementById(
                    "unreadSummary"
                );

            if (
                !Array.isArray(notifications)
            ) {

                return;
            }

            const unreadCount =
                notifications.filter(
                    function(notification) {

                        return notification.readStatus !== true;

                    }
                ).length;

            if (unreadCount > 0) {

                badge.innerText =
                    unreadCount;

                badge.classList.remove(
                    "hidden"
                );

                summary.innerText =
                    unreadCount + " unread";

                summary.classList.remove(
                    "hidden"
                );

            }
            else {

                badge.classList.add(
                    "hidden"
                );

                summary.classList.add(
                    "hidden"
                );

            }

        }

        // =====================================================
        // DISPLAY NOTIFICATIONS
        // =====================================================

        function displayNotifications(
            notifications
        ) {

            const container =
                document.getElementById(
                    "notificationContainer"
                );

            container.innerHTML = "";

            if (
                !Array.isArray(notifications) ||
                notifications.length === 0
            ) {

                showEmptyMessage();

                return;
            }

            notifications.forEach(
                function(notification) {

                    const card =
                        document.createElement(
                            "div"
                        );

                    const isRead =
                        notification.readStatus === true;

                    let cardClass =
                        getCardClass(
                            notification.notificationType
                        );

                    card.className =
                        "notification-card "
                        + cardClass
                        + (
                            isRead
                            ? ""
                            : " unread-card"
                        );

                    const title =
                        escapeHtml(
                            notification.title ||
                            "Notification"
                        );

                    const message =
                        escapeHtml(
                            notification.message ||
                            ""
                        );

                    const type =
                        escapeHtml(
                            notification.notificationType ||
                            "UPDATE"
                        );

                    const bookingId =
                        notification.bookingId ||
                        "-";

                    let actionButtons = "";

                    if (!isRead) {

                        actionButtons += `

                            <button
                                type="button"
                                class="read-btn"
                                onclick="markAsRead(
                                    ${notification.notificationId}
                                )">

                                ✓ Mark as Read

                            </button>

                        `;
                    }

                    actionButtons += `

                        <button
                            type="button"
                            class="delete-btn"
                            onclick="deleteNotification(
                                ${notification.notificationId}
                            )">

                            🗑 Delete

                        </button>

                    `;

                    card.innerHTML = `

                        <div class="notification-top">

                            <div class="notification-title">

                                🔔 ${title}

                            </div>

                            <div class="notification-type">

                                ${type}

                            </div>

                        </div>

                        <div class="notification-message">

                            ${message}

                        </div>

                        <div class="notification-message">

                            <strong>
                                Booking ID:
                            </strong>

                            ${escapeHtml(
                                bookingId
                            )}

                        </div>

                        <div class="notification-bottom">

                            <div class="status ${
                                isRead
                                ? "read"
                                : "new"
                            }">

                                ${
                                    isRead
                                    ? "✓ Read"
                                    : "● New Update"
                                }

                            </div>

                            <div class="action-buttons">

                                ${actionButtons}

                            </div>

                        </div>

                    `;

                    container.appendChild(
                        card
                    );

                }
            );

        }

        // =====================================================
        // GET CARD CLASS
        // =====================================================

        function getCardClass(
            notificationType
        ) {

            const type =
                String(
                    notificationType || ""
                ).toUpperCase();

            if (
                type.includes("APPROVED")
            ) {

                return "approved";

            }

            if (
                type.includes("REJECTED")
            ) {

                return "rejected";

            }

            if (
                type.includes("PAYMENT")
            ) {

                return "payment";

            }

            if (
                type.includes("TRIP")
            ) {

                return "trip";

            }

            return "";

        }

        // =====================================================
        // MARK AS READ
        // =====================================================

        async function markAsRead(
            notificationId
        ) {

            try {

                const response =
                    await fetch(
                        "/api/notifications/read/"
                        + encodeURIComponent(
                            notificationId
                        ),
                        {
                            method: "PUT"
                        }
                    );

                const responseText =
                    await response.text();

                if (!response.ok) {

                    throw new Error(
                        responseText ||
                        "Unable to mark notification as read."
                    );
                }

                await loadNotifications();

            }
            catch (error) {

                console.error(
                    "Mark Read Error:",
                    error
                );

                alert(
                    error.message ||
                    "Unable to mark notification as read."
                );

            }

        }

        // =====================================================
        // DELETE NOTIFICATION
        // =====================================================

        async function deleteNotification(
            notificationId
        ) {

            const confirmed =
                confirm(
                    "Are you sure you want to delete this notification?"
                );

            if (!confirmed) {

                return;
            }

            try {

                const response =
                    await fetch(
                        "/api/notifications/"
                        + encodeURIComponent(
                            notificationId
                        ),
                        {
                            method: "DELETE"
                        }
                    );

                const responseText =
                    await response.text();

                if (!response.ok) {

                    throw new Error(
                        responseText ||
                        "Unable to delete notification."
                    );
                }

                await loadNotifications();

            }
            catch (error) {

                console.error(
                    "Delete Notification Error:",
                    error
                );

                alert(
                    error.message ||
                    "Unable to delete notification."
                );

            }

        }

        // =====================================================
        // EMPTY MESSAGE
        // =====================================================

        function showEmptyMessage() {

            const container =
                document.getElementById(
                    "notificationContainer"
                );

            container.innerHTML = `

                <div class="empty-box">

                    <div class="empty-icon">
                        🔔
                    </div>

                    <h2>
                        No Notifications
                    </h2>

                    <p>
                        You don't have any
                        notifications right now.
                    </p>

                </div>

            `;

        }

        // =====================================================
        // ESCAPE HTML
        // =====================================================

        function escapeHtml(
            value
        ) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";
            }

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                String(value);

            return div.innerHTML;

        }

        // =====================================================
        // INITIAL LOAD
        // =====================================================

        loadNotifications();

        // =====================================================
        // REFRESH UNREAD COUNT
        // =====================================================

        setInterval(
            async function() {

                try {

                    const response =
                        await fetch(
                            "/api/notifications/customer/"
                            + encodeURIComponent(
                                customerId
                            )
                            + "/unread-count"
                        );

                    if (!response.ok) {
                        return;
                    }

                    const count =
                        await response.json();

                    const badge =
                        document.getElementById(
                            "navbarNotificationBadge"
                        );

                    const summary =
                        document.getElementById(
                            "unreadSummary"
                        );

                    if (Number(count) > 0) {

                        badge.innerText =
                            count;

                        badge.classList.remove(
                            "hidden"
                        );

                        summary.innerText =
                            count + " unread";

                        summary.classList.remove(
                            "hidden"
                        );

                    }
                    else {

                        badge.classList.add(
                            "hidden"
                        );

                        summary.classList.add(
                            "hidden"
                        );

                    }

                }
                catch (error) {

                    console.error(
                        "Unread count error:",
                        error
                    );

                }

            },
            10000
        );

    </script>

</body>

</html>
