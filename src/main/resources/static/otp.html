<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>OTP Verification - Autophile Yatra</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {

    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #0f2027,
            #203a43,
            #2c5364
        );

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;
}

.otp-box {

    width: 400px;

    max-width: 95%;

    background: white;

    padding: 35px;

    border-radius: 15px;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.3);

    text-align: center;
}

h1 {

    color: #203a43;

    margin-bottom: 10px;
}

p {

    color: #555;

    margin-bottom: 20px;
}

.mobile-display {

    background: #f2f2f2;

    padding: 12px;

    border-radius: 8px;

    margin-bottom: 20px;

    font-weight: bold;

    color: #203a43;
}

input {

    width: 100%;

    padding: 13px;

    margin: 10px 0;

    border: 1px solid #ccc;

    border-radius: 8px;

    font-size: 20px;

    text-align: center;

    letter-spacing: 6px;

    outline: none;
}

input:focus {

    border-color: #203a43;

    box-shadow:
        0 0 5px rgba(32,58,67,0.3);
}

button {

    width: 100%;

    padding: 13px;

    margin-top: 10px;

    border: none;

    border-radius: 8px;

    background: #203a43;

    color: white;

    font-size: 16px;

    cursor: pointer;
}

button:hover {

    background: #2c5364;
}

button:disabled {

    background: #999;

    cursor: not-allowed;
}

.resend-button {

    background: #1597d4;

    margin-top: 12px;
}

.resend-button:hover {

    background: #087eb5;
}

#result {

    margin-top: 20px;

    font-weight: bold;

    min-height: 22px;
}

#otpInfo {

    margin-top: 15px;

    color: #555;

    font-size: 14px;
}

</style>

</head>


<body>


<div class="otp-box">


    <h1>
        Autophile Yatra
    </h1>


    <p>
        OTP Verification
    </p>


    <div
        class="mobile-display"
        id="mobileDisplay">

        Checking mobile number...

    </div>


    <input
        type="text"
        id="otp"
        placeholder="Enter OTP"
        maxlength="6"
        inputmode="numeric"
        autocomplete="one-time-code"
    >


    <button
        id="verifyButton"
        onclick="verifyOtp()">

        Verify OTP

    </button>


    <button
        id="resendButton"
        class="resend-button"
        onclick="generateOtp()">

        Resend OTP

    </button>


    <div id="otpInfo">
        Generating OTP...
    </div>


    <div id="result"></div>


</div>


<script>


/* =========================
   GET MOBILE NUMBER
========================= */

const mobile =
    sessionStorage.getItem(
        "registrationMobile"
    );


const mobileDisplay =
    document.getElementById(
        "mobileDisplay"
    );


const otpInput =
    document.getElementById(
        "otp"
    );


const verifyButton =
    document.getElementById(
        "verifyButton"
    );


const resendButton =
    document.getElementById(
        "resendButton"
    );


const result =
    document.getElementById(
        "result"
    );


const otpInfo =
    document.getElementById(
        "otpInfo"
    );


/* =========================
   CHECK MOBILE
========================= */

if (!mobile) {

    mobileDisplay.innerText =
        "Mobile number not found.";

    result.style.color =
        "red";

    result.innerText =
        "Registration session expired. Please register again.";

    verifyButton.disabled =
        true;

    resendButton.disabled =
        true;

} else {

    mobileDisplay.innerText =
        "OTP will be sent to: " + mobile;

    /* Automatically generate OTP */

    generateOtp();

}


/* =========================
   ONLY NUMBERS
========================= */

otpInput.addEventListener(
    "input",
    function () {

        this.value =
            this.value
                .replace(/\D/g, "")
                .slice(0, 6);

    }
);


/* =========================
   GENERATE OTP
========================= */

async function generateOtp() {


    if (!mobile) {

        return;

    }


    resendButton.disabled =
        true;

    verifyButton.disabled =
        false;


    otpInfo.innerText =
        "Generating OTP...";


    result.innerText = "";


    try {


        const response =
            await fetch(
                `/api/otp/generate?mobile=${encodeURIComponent(mobile)}`,
                {
                    method: "POST"
                }
            );


        const text =
            await response.text();


        if (response.ok) {


            otpInfo.innerText =
                "OTP generated successfully. Please enter the 6-digit OTP.";

            result.style.color =
                "green";

            result.innerText =
                text;


        } else {


            otpInfo.innerText =
                "Unable to generate OTP.";

            result.style.color =
                "red";

            result.innerText =
                text;


        }


    } catch (error) {


        console.error(error);


        otpInfo.innerText =
            "Unable to connect to server.";

        result.style.color =
            "red";

        result.innerText =
            "Server error. Please try again.";


    } finally {


        resendButton.disabled =
            false;

    }

}


/* =========================
   VERIFY OTP
========================= */

async function verifyOtp() {


    const otp =
        otpInput.value.trim();


    result.innerText = "";


    /* OTP validation */

    if (!/^[0-9]{6}$/.test(otp)) {


        result.style.color =
            "red";


        result.innerText =
            "Please enter a valid 6-digit OTP.";


        return;

    }


    if (!mobile) {


        result.style.color =
            "red";


        result.innerText =
            "Mobile number not found. Please register again.";


        return;

    }


    verifyButton.disabled =
        true;


    verifyButton.innerText =
        "Verifying...";


    try {


        const response =
            await fetch(
                `/api/otp/verify?mobile=${encodeURIComponent(mobile)}&otp=${encodeURIComponent(otp)}`,
                {
                    method: "POST"
                }
            );


        const text =
            await response.text();


        /* =========================
           OTP SUCCESS
        ========================= */

        if (
            response.ok &&
            text.includes(
                "OTP verified successfully"
            )
        ) {


            result.style.color =
                "green";


            result.innerText =
                "OTP verified successfully!";


            otpInfo.innerText =
                "Registration completed successfully.";


            /*
             * Remove temporary
             * registration mobile.
             */

            sessionStorage.removeItem(
                "registrationMobile"
            );


            /*
             * Go to CUSTOMER LOGIN.
             */

            setTimeout(
                function () {

                    window.location.href =
                        "/login.html";

                },
                1500
            );


        } else {


            result.style.color =
                "red";


            result.innerText =
                text || "Invalid OTP.";


            verifyButton.disabled =
                false;


            verifyButton.innerText =
                "Verify OTP";

        }


    } catch (error) {


        console.error(error);


        result.style.color =
            "red";


        result.innerText =
            "Server error while verifying OTP.";


        verifyButton.disabled =
            false;


        verifyButton.innerText =
            "Verify OTP";

    }

}

</script>


</body>

</html>
