<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Drivers - Autophile Yatra</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #222;
        }

        .navbar {
            background: #0b3d62;
            color: white;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .back-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .container {
            width: 94%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        h1, h2 {
            color: #0b3d62;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .add-btn {
            margin-top: 20px;
            background: #198754;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .clear-btn {
            margin-top: 20px;
            margin-left: 8px;
            background: #6c757d;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .refresh-btn {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th {
            background: #0b3d62;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f7f9fb;
        }

        .active {
            color: #198754;
            font-weight: bold;
        }

        .inactive {
            color: #dc3545;
            font-weight: bold;
        }

        .action-btn {
            border: none;
            padding: 7px 10px;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            margin: 2px;
        }

        .edit-btn {
            background: #0d6efd;
        }

        .activate-btn {
            background: #198754;
        }

        .deactivate-btn {
            background: #fd7e14;
        }

        .delete-btn {
            background: #dc3545;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 7px;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #666;
        }

        @media (max-width: 800px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .navbar {
                padding: 14px;
            }

            .logo {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <div class="navbar">

        <div class="logo">
            Autophile Yatra - Manage Drivers
        </div>

        <button
            class="back-btn"
            onclick="goBack()">
            Back to Dashboard
        </button>

    </div>


    <div class="container">

        <!-- ADD / EDIT DRIVER -->

        <div class="card">

            <h1 id="formTitle">
                Add New Driver
            </h1>

            <div class="form-grid">

                <div class="form-group">

                    <label for="driverName">
                        Driver Name
                    </label>

                    <input
                        type="text"
                        id="driverName"
                        placeholder="Enter driver name">

                </div>


                <div class="form-group">

                    <label for="mobile">
                        Mobile Number
                    </label>

                    <input
                        type="text"
                        id="mobile"
                        maxlength="10"
                        inputmode="numeric"
                        placeholder="Enter 10 digit mobile">

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password">

                </div>

            </div>


            <button
                class="add-btn"
                id="saveButton"
                onclick="saveDriver()">
                Add Driver
            </button>

            <button
                class="clear-btn"
                onclick="clearForm()">
                Clear
            </button>


            <div
                id="message"
                class="message">
            </div>

        </div>


        <!-- DRIVER LIST -->

        <div class="card">

            <h2>
                All Drivers
            </h2>

            <button
                class="refresh-btn"
                onclick="loadDrivers()">
                🔄 Refresh Drivers
            </button>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Driver Name
                            </th>

                            <th>
                                Mobile
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody id="driverTable">

                        <tr>

                            <td
                                colspan="5"
                                class="empty">

                                Loading drivers...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script>

        let editingDriverId = null;


        // =====================================================
        // SHOW MESSAGE
        // =====================================================

        function showMessage(text, success) {

            const message =
                document.getElementById("message");

            message.style.display = "block";

            message.textContent = text;


            if (success) {

                message.style.background = "#d1e7dd";
                message.style.color = "#0f5132";

            } else {

                message.style.background = "#f8d7da";
                message.style.color = "#842029";

            }

        }


        // =====================================================
        // LOAD DRIVERS
        // =====================================================

        async function loadDrivers() {

            const table =
                document.getElementById("driverTable");


            table.innerHTML = `
                <tr>
                    <td colspan="5" class="empty">
                        Loading drivers...
                    </td>
                </tr>
            `;


            try {

                const response =
                    await fetch("/api/admin/drivers");


                if (!response.ok) {

                    throw new Error(
                        "Unable to load drivers"
                    );
                }


                const drivers =
                    await response.json();


                table.innerHTML = "";


                if (!drivers || drivers.length === 0) {

                    table.innerHTML = `
                        <tr>
                            <td colspan="5" class="empty">
                                No drivers available.
                            </td>
                        </tr>
                    `;

                    return;
                }


                drivers.forEach(function(driver) {

                    const row =
                        document.createElement("tr");


                    const status =
                        driver.active
                            ? `<span class="active">Active</span>`
                            : `<span class="inactive">Inactive</span>`;


                    let actionButtons = `
                        <button
                            class="action-btn edit-btn"
                            onclick="editDriver(${driver.driverId})">
                            Edit
                        </button>
                    `;


                    if (driver.active) {

                        actionButtons += `
                            <button
                                class="action-btn deactivate-btn"
                                onclick="deactivateDriver(${driver.driverId})">
                                Deactivate
                            </button>
                        `;

                    } else {

                        actionButtons += `
                            <button
                                class="action-btn activate-btn"
                                onclick="activateDriver(${driver.driverId})">
                                Activate
                            </button>
                        `;

                    }


                    actionButtons += `
                        <button
                            class="action-btn delete-btn"
                            onclick="deleteDriver(${driver.driverId})">
                            Delete
                        </button>
                    `;


                    row.innerHTML = `

                        <td>
                            ${driver.driverId}
                        </td>

                        <td>
                            ${driver.driverName || "-"}
                        </td>

                        <td>
                            ${driver.mobile || "-"}
                        </td>

                        <td>
                            ${status}
                        </td>

                        <td>
                            ${actionButtons}
                        </td>

                    `;


                    table.appendChild(row);

                });


            } catch (error) {

                console.error(error);


                table.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty">
                            ${error.message}
                        </td>
                    </tr>
                `;

            }

        }


        // =====================================================
        // ADD / UPDATE DRIVER
        // =====================================================

        async function saveDriver() {

            const driverName =
                document
                    .getElementById("driverName")
                    .value
                    .trim();


            const mobile =
                document
                    .getElementById("mobile")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            if (!driverName) {

                showMessage(
                    "Driver name is required.",
                    false
                );

                return;
            }


            if (!/^[0-9]{10}$/.test(mobile)) {

                showMessage(
                    "Enter a valid 10 digit mobile number.",
                    false
                );

                return;
            }


            if (!password || password.length < 6) {

                showMessage(
                    "Password must contain at least 6 characters.",
                    false
                );

                return;
            }


            try {

                let response;


                if (editingDriverId === null) {

                    const params =
                        new URLSearchParams();

                    params.append(
                        "driverName",
                        driverName
                    );

                    params.append(
                        "mobile",
                        mobile
                    );

                    params.append(
                        "password",
                        password
                    );


                    response =
                        await fetch(
                            "/api/admin/drivers/add?" +
                            params.toString(),
                            {
                                method: "POST"
                            }
                        );


                } else {

                    const params =
                        new URLSearchParams();

                    params.append(
                        "driverName",
                        driverName
                    );

                    params.append(
                        "mobile",
                        mobile
                    );

                    params.append(
                        "password",
                        password
                    );


                    response =
                        await fetch(
                            "/api/admin/drivers/" +
                            editingDriverId +
                            "?" +
                            params.toString(),
                            {
                                method: "PUT"
                            }
                        );

                }


                const result =
                    await response.text();


                if (!response.ok) {

                    showMessage(
                        result,
                        false
                    );

                    return;
                }


                if (editingDriverId === null) {

                    showMessage(
                        "Driver added successfully.",
                        true
                    );

                } else {

                    showMessage(
                        "Driver updated successfully.",
                        true
                    );

                }


                clearForm();

                loadDrivers();


            } catch (error) {

                console.error(error);

                showMessage(
                    "Unable to connect to server.",
                    false
                );

            }

        }


        // =====================================================
        // EDIT DRIVER
        // =====================================================

        async function editDriver(driverId) {

            try {

                const response =
                    await fetch(
                        "/api/admin/drivers/" +
                        driverId
                    );


                if (!response.ok) {

                    throw new Error(
                        "Driver not found"
                    );

                }


                const driver =
                    await response.json();


                editingDriverId =
                    driver.driverId;


                document
                    .getElementById("driverName")
                    .value =
                    driver.driverName || "";


                document
                    .getElementById("mobile")
                    .value =
                    driver.mobile || "";


                /*
                 * Password is never returned to the
                 * browser from the driver list.
                 *
                 * Admin must enter a new password
                 * when editing.
                 */

                document
                    .getElementById("password")
                    .value = "";


                document
                    .getElementById("formTitle")
                    .textContent =
                    "Edit Driver";


                document
                    .getElementById("saveButton")
                    .textContent =
                    "Update Driver";


                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });


            } catch (error) {

                showMessage(
                    error.message,
                    false
                );

            }

        }


        // =====================================================
        // ACTIVATE DRIVER
        // =====================================================

        async function activateDriver(driverId) {

            try {

                const response =
                    await fetch(
                        "/api/admin/drivers/" +
                        driverId +
                        "/activate",
                        {
                            method: "PUT"
                        }
                    );


                const result =
                    await response.text();


                if (!response.ok) {

                    alert(result);

                    return;
                }


                alert(
                    "Driver activated successfully."
                );


                loadDrivers();


            } catch (error) {

                alert(
                    "Unable to connect to server."
                );

            }

        }


        // =====================================================
        // DEACTIVATE DRIVER
        // =====================================================

        async function deactivateDriver(driverId) {

            const confirmResult =
                confirm(
                    "Are you sure you want to deactivate this driver?"
                );


            if (!confirmResult) {
                return;
            }


            try {

                const response =
                    await fetch(
                        "/api/admin/drivers/" +
                        driverId +
                        "/deactivate",
                        {
                            method: "PUT"
                        }
                    );


                const result =
                    await response.text();


                if (!response.ok) {

                    alert(result);

                    return;
                }


                alert(
                    "Driver deactivated successfully."
                );


                loadDrivers();


            } catch (error) {

                alert(
                    "Unable to connect to server."
                );

            }

        }


        // =====================================================
        // DELETE DRIVER
        // =====================================================

        async function deleteDriver(driverId) {

            const confirmResult =
                confirm(
                    "Are you sure you want to permanently delete this driver?"
                );


            if (!confirmResult) {
                return;
            }


            try {

                const response =
                    await fetch(
                        "/api/admin/drivers/" +
                        driverId,
                        {
                            method: "DELETE"
                        }
                    );


                const result =
                    await response.text();


                if (!response.ok) {

                    alert(result);

                    return;
                }


                alert(result);


                loadDrivers();


            } catch (error) {

                alert(
                    "Unable to connect to server."
                );

            }

        }


        // =====================================================
        // CLEAR FORM
        // =====================================================

        function clearForm() {

            editingDriverId = null;


            document
                .getElementById("driverName")
                .value = "";


            document
                .getElementById("mobile")
                .value = "";


            document
                .getElementById("password")
                .value = "";


            document
                .getElementById("formTitle")
                .textContent =
                "Add New Driver";


            document
                .getElementById("saveButton")
                .textContent =
                "Add Driver";


            document
                .getElementById("message")
                .style.display =
                "none";

        }


        // =====================================================
        // BACK TO ADMIN DASHBOARD
        // =====================================================

        function goBack() {

            window.location.href =
                "/admin-dashboard.html";

        }


        // =====================================================
        // PAGE LOAD
        // =====================================================

        loadDrivers();

    </script>

</body>
</html>
