<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Explore Tours - Autophile Yatra</title>


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f7fb;
}


/* ================= NAVBAR ================= */

.navbar {
    background: #0b3d91;
    color: white;
    padding: 18px 40px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.back-btn {
    background: white;
    color: #0b3d91;

    padding: 9px 18px;

    border: none;
    border-radius: 6px;

    cursor: pointer;
    font-weight: bold;
}

.back-btn:hover {
    background: #e8f1ff;
}


/* ================= PAGE ================= */

.container {
    width: 90%;
    max-width: 1200px;
    margin: 35px auto;
}

.heading {
    text-align: center;
    margin-bottom: 30px;
}

.heading h1 {
    color: #0b3d91;
    margin-bottom: 8px;
}

.heading p {
    color: #666;
}


/* ================= TOUR GRID ================= */

.tour-container {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(260px, 1fr));

    gap: 25px;
}


/* ================= TOUR CARD ================= */

.tour-card {
    background: white;

    border-radius: 12px;

    overflow: hidden;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.1);

    transition: 0.3s;
}

.tour-card:hover {
    transform: translateY(-5px);

    box-shadow:
        0 10px 25px rgba(0,0,0,0.15);
}

.tour-image {
    width: 100%;
    height: 190px;

    object-fit: cover;
}

.tour-details {
    padding: 20px;
}

.tour-details h2 {
    color: #0b3d91;
    margin-bottom: 10px;
}

.info {
    display: flex;

    justify-content: space-between;

    margin-bottom: 15px;
}

.days {
    color: #333;
}

.price {
    color: #0b3d91;

    font-size: 18px;

    font-weight: bold;
}

.slots {
    color: #555;
    margin-bottom: 15px;
}

.book-btn {
    width: 100%;

    padding: 11px;

    background: #0b3d91;

    color: white;

    border: none;

    border-radius: 6px;

    font-size: 16px;

    cursor: pointer;
}

.book-btn:hover {
    background: #062d6b;
}

.book-btn:disabled {
    background: #999;
    cursor: not-allowed;
}


/* ================= MESSAGE ================= */

#message {
    text-align: center;

    margin-top: 30px;

    color: #777;

    font-size: 18px;
}


/* ================= BOOKING FORM ================= */

#bookingSection {
    display: none;

    background: white;

    max-width: 700px;

    margin: 40px auto;

    padding: 25px;

    border-radius: 12px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.15);
}

#bookingSection h2 {
    color: #0b3d91;

    margin-bottom: 20px;

    text-align: center;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;

    margin-bottom: 6px;

    font-weight: bold;

    color: #333;
}

.form-group input,
.form-group select {

    width: 100%;

    padding: 11px;

    border: 1px solid #ccc;

    border-radius: 6px;

    font-size: 15px;
}

.form-group input:focus,
.form-group select:focus {

    outline: none;

    border-color: #0b3d91;
}


/* ================= TRAVELERS ================= */

#travelerDetails {
    margin-top: 15px;
}

.traveler-box {

    background: #f8fafc;

    padding: 20px;

    margin-top: 15px;

    border-radius: 10px;

    border: 1px solid #dbe3ef;
}

.traveler-title {

    color: #0b3d91;

    margin-bottom: 18px;

    font-size: 19px;
}

.traveler-number {

    background: #0b3d91;

    color: white;

    display: inline-block;

    padding: 4px 10px;

    border-radius: 20px;

    font-size: 13px;

    margin-bottom: 10px;
}


/* ================= BUTTONS ================= */

.confirm-btn {

    width: 100%;

    padding: 12px;

    background: #0b3d91;

    color: white;

    border: none;

    border-radius: 6px;

    font-size: 16px;

    cursor: pointer;

    margin-top: 10px;
}

.confirm-btn:hover {
    background: #062d6b;
}

.confirm-btn:disabled {
    background: #999;
    cursor: not-allowed;
}

.cancel-btn {

    width: 100%;

    padding: 10px;

    margin-top: 10px;

    background: #777;

    color: white;

    border: none;

    border-radius: 6px;

    cursor: pointer;
}

.cancel-btn:hover {
    background: #555;
}


/* ================= BOOKING MESSAGE ================= */

#bookingMessage {

    margin-top: 15px;

    text-align: center;

    font-weight: bold;

    min-height: 20px;
}


/* ================= MOBILE ================= */

@media (max-width: 700px) {

    .navbar {
        padding: 15px 20px;
    }

    .logo {
        font-size: 19px;
    }

    .container {
        width: 94%;
    }

    #bookingSection {
        width: 100%;
    }

    .info {
        flex-direction: column;
        gap: 8px;
    }

}

</style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<div class="navbar">

    <div class="logo">
        Autophile Yatra
    </div>

    <button
        class="back-btn"
        onclick="goDashboard()">

        Dashboard

    </button>

</div>



<!-- ================= PAGE ================= -->

<div class="container">


    <div class="heading">

        <h1>
            Explore Tours
        </h1>

        <p>
            Choose your next adventure with Autophile Yatra
        </p>

    </div>



    <!-- ================= TOUR LIST ================= -->

    <div
        class="tour-container"
        id="tourContainer">

    </div>


    <div id="message">
        Loading tours...
    </div>



    <!-- ================= BOOKING FORM ================= -->

    <div id="bookingSection">

        <h2>
            Book Your Tour
        </h2>


        <!-- SELECTED TOUR -->

        <div class="form-group">

            <label>
                Selected Tour
            </label>

            <input
                type="text"
                id="selectedTour"
                readonly>

        </div>



        <!-- TRAVEL DATE -->

        <div class="form-group">

            <label>
                Travel Date
            </label>

            <input
                type="date"
                id="travelDate">

        </div>



        <!-- NUMBER OF PERSONS -->

        <div class="form-group">

            <label>
                Number of Persons
            </label>

            <input
                type="number"
                id="numberOfPersons"

                min="1"
                max="20"

                value="1"

                oninput="generateTravelerForms()">

        </div>



        <!-- TRAVELERS -->

        <div id="travelerDetails"></div>



        <!-- CONFIRM -->

        <button
            id="confirmButton"

            class="confirm-btn"

            onclick="confirmBooking()">

            Confirm Booking

        </button>



        <!-- CANCEL -->

        <button
            class="cancel-btn"

            onclick="cancelBooking()">

            Cancel

        </button>



        <div id="bookingMessage"></div>

    </div>

</div>



<script>


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let selectedTourId = null;

let selectedTourData = null;



/* =====================================================
   TOUR NAMES
===================================================== */

function getTourName(tour) {

    /*
     * If database already contains name,
     * use database name.
     */

    if (
        tour.name &&
        tour.name.trim() !== ""
    ) {

        return tour.name;

    }


    /*
     * Temporary fallback names
     * because current database rows
     * are returning name = null.
     */

    switch (Number(tour.tourId)) {

        case 1:
            return "Goa Beach Escape";

        case 2:
            return "Manali Mountain Adventure";

        case 3:
            return "Kerala Backwater Trip";

        case 4:
            return "Rajasthan Heritage Tour";

        default:
            return "Autophile Yatra Tour";

    }

}



/* =====================================================
   TOUR IMAGES
===================================================== */

function getTourImage(tour) {

    /*
     * If database contains imageUrl,
     * use it.
     */

    if (
        tour.imageUrl &&
        tour.imageUrl.trim() !== ""
    ) {

        return tour.imageUrl;

    }


    /*
     * Different images for each tour.
     *
     * These are online images.
     */

    switch (Number(tour.tourId)) {

        case 1:
            return "https://images.unsplash.com/photo-1512343879784-a960bf40e7f2?auto=format&fit=crop&w=900&q=80";

        case 2:
            return "https://images.unsplash.com/photo-1626621341517-bbf3d9990a23?auto=format&fit=crop&w=900&q=80";

        case 3:
            return "https://images.unsplash.com/photo-1602216056096-3b40cc0c9944?auto=format&fit=crop&w=900&q=80";

        case 4:
            return "https://images.unsplash.com/photo-1477587458883-47145ed94245?auto=format&fit=crop&w=900&q=80";

        default:
            return "https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=900&q=80";

    }

}



/* =====================================================
   CHECK CUSTOMER LOGIN
===================================================== */

const customerId =
    sessionStorage.getItem(
        "customerId"
    );


if (!customerId) {

    alert(
        "Please login before booking a tour."
    );

    window.location.href =
        "/login.html";

}



/* =====================================================
   LOAD ALL TOURS
===================================================== */

async function loadTours() {

    const container =
        document.getElementById(
            "tourContainer"
        );

    const message =
        document.getElementById(
            "message"
        );


    try {

        const response =
            await fetch(
                "/api/tours"
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load tours."
            );

        }


        const tours =
            await response.json();


        console.log(
            "Tours received:",
            tours
        );


        displayTours(tours);


    }
    catch (error) {

        console.error(error);

        container.innerHTML = "";

        message.style.color =
            "red";

        message.innerText =
            "Unable to load tours. Please try again.";

    }

}



/* =====================================================
   DISPLAY TOURS
===================================================== */

function displayTours(tours) {

    const container =
        document.getElementById(
            "tourContainer"
        );

    const message =
        document.getElementById(
            "message"
        );


    container.innerHTML = "";


    if (
        !tours ||
        tours.length === 0
    ) {

        message.innerText =
            "No tours available right now.";

        return;

    }


    message.innerText = "";


    tours.forEach(
        function(tour) {


            const tourId =
                Number(
                    tour.tourId
                );


            const tourName =
                getTourName(
                    tour
                );


            const image =
                getTourImage(
                    tour
                );


            const slots =
                Number(
                    tour.availableSlots || 0
                );


            const duration =
                Number(
                    tour.durationDays || 0
                );


            const amount =
                Number(
                    tour.totalAmount || 0
                );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "tour-card";


            card.innerHTML = `

                <img
                    class="tour-image"

                    src="${escapeHtml(image)}"

                    alt="${escapeHtml(tourName)}"

                    onerror="this.src='https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=900&q=80'"
                >


                <div class="tour-details">


                    <h2>
                        ${escapeHtml(tourName)}
                    </h2>


                    <div class="info">

                        <span class="days">

                            🗓 ${duration} Days

                        </span>


                        <span class="price">

                            ₹${amount.toLocaleString("en-IN")}

                        </span>

                    </div>


                    <div class="slots">

                        👥 Available Slots:
                        ${slots}

                    </div>


                    <button

                        class="book-btn"

                        ${slots <= 0 ? "disabled" : ""}

                        onclick="bookTour(${tourId})"

                    >

                        ${
                            slots <= 0
                            ? "No Slots Available"
                            : "Book This Tour"
                        }

                    </button>


                </div>

            `;


            container.appendChild(
                card
            );

        }
    );

}



/* =====================================================
   SELECT / BOOK TOUR
===================================================== */

async function bookTour(tourId) {

    console.log(
        "Selected Tour ID:",
        tourId
    );


    try {


        if (
            !tourId ||
            Number.isNaN(
                Number(tourId)
            )
        ) {

            throw new Error(
                "Invalid tour ID."
            );

        }


        /*
         * Get latest tour information
         */

        const response =
            await fetch(
                "/api/tours/" +
                encodeURIComponent(
                    tourId
                )
            );


        const responseText =
            await response.text();


        if (!response.ok) {

            throw new Error(
                responseText ||
                "Tour not found."
            );

        }


        let tour;


        try {

            tour =
                JSON.parse(
                    responseText
                );

        }
        catch (error) {

            throw new Error(
                "Invalid tour response from server."
            );

        }


        console.log(
            "Selected tour:",
            tour
        );


        /*
         * IMPORTANT:
         * Backend field = tourId
         */

        selectedTourId =
            Number(
                tour.tourId
            );


        if (
            !selectedTourId ||
            Number.isNaN(
                selectedTourId
            )
        ) {

            throw new Error(
                "Tour ID was not received from server."
            );

        }


        /*
         * Store complete selected tour
         */

        selectedTourData =
            tour;


        /*
         * Get name.
         */

        const tourName =
            getTourName(
                tour
            );


        /*
         * Check available slots.
         */

        const availableSlots =
            Number(
                tour.availableSlots || 0
            );


        if (
            availableSlots <= 0
        ) {

            throw new Error(
                "This tour is not available because no slots are remaining."
            );

        }


        /*
         * SHOW SELECTED TOUR
         */

        const selectedTour =
            document.getElementById(
                "selectedTour"
            );


        selectedTour.value =
            tourName;


        /*
         * Set today's date as minimum.
         */

        const today =
            new Date()
                .toISOString()
                .split("T")[0];


        const travelDate =
            document.getElementById(
                "travelDate"
            );


        travelDate.min =
            today;


        travelDate.value =
            "";


        /*
         * Reset persons.
         */

        document.getElementById(
            "numberOfPersons"
        ).value = 1;


        /*
         * Clear old message.
         */

        document.getElementById(
            "bookingMessage"
        ).innerText = "";


        /*
         * Generate traveler form.
         */

        generateTravelerForms();


        /*
         * SHOW BOOKING SECTION
         */

        const bookingSection =
            document.getElementById(
                "bookingSection"
            );


        bookingSection.style.display =
            "block";


        /*
         * Scroll to booking section.
         */

        bookingSection.scrollIntoView({
            behavior: "smooth"
        });


    }
    catch (error) {

        console.error(
            "Book Tour Error:",
            error
        );

        alert(
            error.message ||
            "Unable to select tour."
        );

    }

}



/* =====================================================
   GENERATE TRAVELER FORMS
===================================================== */

function generateTravelerForms() {


    let numberOfPersons =
        parseInt(
            document.getElementById(
                "numberOfPersons"
            ).value
        );


    const travelerDetails =
        document.getElementById(
            "travelerDetails"
        );


    travelerDetails.innerHTML =
        "";


    if (
        !numberOfPersons ||
        numberOfPersons < 1
    ) {

        numberOfPersons = 1;

        document.getElementById(
            "numberOfPersons"
        ).value = 1;

    }


    if (
        numberOfPersons > 20
    ) {

        numberOfPersons = 20;

        document.getElementById(
            "numberOfPersons"
        ).value = 20;


        alert(
            "Maximum 20 persons allowed."
        );

    }


    /*
     * Check available slots.
     */

    if (
        selectedTourData
    ) {

        const availableSlots =
            Number(
                selectedTourData.availableSlots || 0
            );


        if (
            numberOfPersons >
            availableSlots
        ) {

            numberOfPersons =
                availableSlots;


            document.getElementById(
                "numberOfPersons"
            ).value =
                availableSlots;


            alert(
                "Only " +
                availableSlots +
                " slots are available."
            );

        }

    }


    /*
     * Create traveler forms.
     */

    for (
        let i = 1;
        i <= numberOfPersons;
        i++
    ) {


        const travelerBox =
            document.createElement(
                "div"
            );


        travelerBox.className =
            "traveler-box";


        travelerBox.innerHTML = `

            <span class="traveler-number">

                Traveler ${i}

            </span>


            <h3 class="traveler-title">

                Person ${i} Details

            </h3>


            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"

                    id="travelerName${i}"

                    placeholder="Enter full name"
                >

            </div>


            <div class="form-group">

                <label>
                    Date of Birth
                </label>

                <input
                    type="date"

                    id="travelerDob${i}"
                >

            </div>


            <div class="form-group">

                <label>
                    Mobile Number
                </label>

                <input
                    type="tel"

                    id="travelerMobile${i}"

                    placeholder="Enter 10-digit mobile number"

                    maxlength="10"
                >

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"

                    id="travelerEmail${i}"

                    placeholder="Enter email address"
                >

            </div>


            <div class="form-group">

                <label>
                    Gender
                </label>

                <select
                    id="travelerGender${i}">

                    <option value="">
                        Select Gender
                    </option>

                    <option value="MALE">
                        Male
                    </option>

                    <option value="FEMALE">
                        Female
                    </option>

                    <option value="OTHER">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    ID Proof Number
                </label>

                <input
                    type="text"

                    id="travelerIdProof${i}"

                    placeholder="Enter ID proof number"
                >

            </div>

        `;


        travelerDetails.appendChild(
            travelerBox
        );


        /*
         * Mobile validation.
         */

        document
            .getElementById(
                "travelerMobile" + i
            )
            .addEventListener(
                "input",
                function() {

                    this.value =
                        this.value
                            .replace(
                                /\D/g,
                                ""
                            )
                            .slice(
                                0,
                                10
                            );

                }
            );

    }

}



/* =====================================================
   GET TRAVELER DETAILS
===================================================== */

function getTravelerDetails() {


    const numberOfPersons =
        parseInt(
            document.getElementById(
                "numberOfPersons"
            ).value
        );


    const travelers = [];


    for (
        let i = 1;
        i <= numberOfPersons;
        i++
    ) {


        const traveler = {

            name:
                document.getElementById(
                    "travelerName" + i
                ).value.trim(),


            dateOfBirth:
                document.getElementById(
                    "travelerDob" + i
                ).value,


            mobile:
                document.getElementById(
                    "travelerMobile" + i
                ).value.trim(),


            email:
                document.getElementById(
                    "travelerEmail" + i
                ).value.trim(),


            gender:
                document.getElementById(
                    "travelerGender" + i
                ).value,


            idProof:
                document.getElementById(
                    "travelerIdProof" + i
                ).value.trim()

        };


        travelers.push(
            traveler
        );

    }


    return travelers;

}



/* =====================================================
   VALIDATE TRAVELERS
===================================================== */

function validateTravelerDetails(
    travelers
) {


    for (
        let i = 0;
        i < travelers.length;
        i++
    ) {


        const traveler =
            travelers[i];


        const person =
            i + 1;


        if (
            !traveler.name
        ) {

            return (
                "Please enter name for Person "
                + person
            );

        }


        if (
            !traveler.dateOfBirth
        ) {

            return (
                "Please select date of birth for Person "
                + person
            );

        }


        if (
            !/^[0-9]{10}$/.test(
                traveler.mobile
            )
        ) {

            return (
                "Please enter valid 10-digit mobile number for Person "
                + person
            );

        }


        if (
            !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
                .test(
                    traveler.email
                )
        ) {

            return (
                "Please enter valid email for Person "
                + person
            );

        }


        if (
            !traveler.gender
        ) {

            return (
                "Please select gender for Person "
                + person
            );

        }


        if (
            !traveler.idProof
        ) {

            return (
                "Please enter ID proof for Person "
                + person
            );

        }

    }


    return null;

}



/* =====================================================
   CONFIRM BOOKING
===================================================== */

async function confirmBooking() {


    const bookingMessage =
        document.getElementById(
            "bookingMessage"
        );


    const confirmButton =
        document.getElementById(
            "confirmButton"
        );


    /*
     * CHECK CUSTOMER LOGIN
     */

    const loggedInCustomerId =
        sessionStorage.getItem(
            "customerId"
        );


    if (
        !loggedInCustomerId
    ) {

        bookingMessage.style.color =
            "red";

        bookingMessage.innerText =
            "Please login before booking.";


        setTimeout(
            function() {

                window.location.href =
                    "/login.html";

            },
            1000
        );


        return;

    }



    /*
     * CHECK SELECTED TOUR
     */

    if (
        !selectedTourId
    ) {

        bookingMessage.style.color =
            "red";

        bookingMessage.innerText =
            "Please select a tour.";


        return;

    }



    /*
     * TRAVEL DATE
     */

    const travelDate =
        document.getElementById(
            "travelDate"
        ).value;


    if (
        !travelDate
    ) {

        bookingMessage.style.color =
            "red";

        bookingMessage.innerText =
            "Please select travel date.";


        return;

    }



    /*
     * NUMBER OF PERSONS
     */

    const numberOfPersons =
        parseInt(
            document.getElementById(
                "numberOfPersons"
            ).value
        );


    if (
        !numberOfPersons ||
        numberOfPersons <= 0
    ) {

        bookingMessage.style.color =
            "red";

        bookingMessage.innerText =
            "Please enter valid number of persons.";


        return;

    }



    /*
     * CHECK SLOTS
     */

    if (
        selectedTourData
    ) {

        const availableSlots =
            Number(
                selectedTourData.availableSlots || 0
            );


        if (
            numberOfPersons >
            availableSlots
        ) {

            bookingMessage.style.color =
                "red";

            bookingMessage.innerText =
                "Not enough available slots.";


            return;

        }

    }



    /*
     * GET TRAVELERS
     */

    const travelers =
        getTravelerDetails();


    const validationError =
        validateTravelerDetails(
            travelers
        );


    if (
        validationError
    ) {

        bookingMessage.style.color =
            "red";

        bookingMessage.innerText =
            validationError;


        return;

    }



    /*
     * DISABLE BUTTON
     */

    confirmButton.disabled =
        true;


    confirmButton.innerText =
        "Creating Booking...";


    bookingMessage.style.color =
        "blue";


    bookingMessage.innerText =
        "Creating booking...";



    try {


        /*
         * CREATE BOOKING URL
         */

        const bookingUrl =

            "/api/bookings/create" +

            "?customerId=" +

            encodeURIComponent(
                loggedInCustomerId
            ) +

            "&tourId=" +

            encodeURIComponent(
                selectedTourId
            ) +

            "&travelDate=" +

            encodeURIComponent(
                travelDate
            ) +

            "&numberOfPersons=" +

            encodeURIComponent(
                numberOfPersons
            );



        console.log(
            "Booking URL:",
            bookingUrl
        );



        /*
         * CREATE BOOKING
         */

        const bookingResponse =
            await fetch(
                bookingUrl,
                {
                    method: "POST"
                }
            );


        const bookingText =
            await bookingResponse.text();


        console.log(
            "Booking response:",
            bookingText
        );


        if (
            !bookingResponse.ok
        ) {

            throw new Error(
                bookingText ||
                "Booking creation failed."
            );

        }



        /*
         * CONVERT RESPONSE
         */

        let booking;


        try {

            booking =
                JSON.parse(
                    bookingText
                );

        }
        catch (error) {

            throw new Error(
                bookingText ||
                "Invalid booking response."
            );

        }



        console.log(
            "Booking created:",
            booking
        );



        /*
         * GET BOOKING ID
         */

        const bookingId =
            booking.bookingId;


        if (
            !bookingId
        ) {

            throw new Error(
                "Booking ID was not received from server."
            );

        }



        /*
         * SAVE TRAVELER DETAILS
         */

        bookingMessage.innerText =
            "Saving traveler details...";


        const travelerResponse =
            await fetch(

                "/api/travelers/booking/" +
                bookingId,

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            travelers
                        )

                }

            );


        const travelerText =
            await travelerResponse.text();


        if (
            !travelerResponse.ok
        ) {

            throw new Error(
                travelerText ||
                "Traveler details could not be saved."
            );

        }



        /*
         * SUCCESS
         */

        bookingMessage.style.color =
            "green";


        bookingMessage.innerText =

            "Booking created successfully! Booking ID: "
            +
            bookingId;



        /*
         * Go to My Bookings
         */

        setTimeout(
            function() {

                window.location.href =
                    "/my-bookings.html";

            },
            1500
        );


    }
    catch (error) {


        console.error(
            "Booking Error:",
            error
        );


        bookingMessage.style.color =
            "red";


        bookingMessage.innerText =
            error.message ||
            "Unable to create booking.";


        confirmButton.disabled =
            false;


        confirmButton.innerText =
            "Confirm Booking";

    }

}



/* =====================================================
   CANCEL BOOKING
===================================================== */

function cancelBooking() {


    document.getElementById(
        "bookingSection"
    ).style.display =
        "none";


    document.getElementById(
        "travelerDetails"
    ).innerHTML =
        "";


    document.getElementById(
        "bookingMessage"
    ).innerText =
        "";


    document.getElementById(
        "selectedTour"
    ).value =
        "";


    selectedTourId =
        null;


    selectedTourData =
        null;

}



/* =====================================================
   DASHBOARD
===================================================== */

function goDashboard() {

    window.location.href =
        "/customer-dashboard.html";

}



/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(value) {


    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

   START
