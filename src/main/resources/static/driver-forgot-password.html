<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Driver Forgot Password - Autophile Yatra</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
        }

        .container {
            width: 420px;
            max-width: 92%;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #0b3d62;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #0b3d62;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #0d6efd;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        .step-title {
            color: #0b3d62;
            margin-bottom: 10px;
        }

        .note {
            color: #666;
            font-size: 14px;
            margin-bottom: 18px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Forgot Password</h1>

    <p class="subtitle">
        Driver Account - Autophile Yatra
    </p>


    <!-- STEP 1 -->

    <div id="step1" class="step active">

        <h3 class="step-title">
            Verify Mobile Number
        </h3>

        <p class="note">
            Enter the mobile number registered by Admin.
        </p>

        <form onsubmit="generateOtp(event)">

            <label for="mobile">
                Mobile Number
            </label>

            <input
                type="text"
                id="mobile"
                maxlength="10"
                inputmode="numeric"
                placeholder="Enter mobile number"
                required
            >

            <button type="submit">
                Send OTP
            </button>

        </form>

    </div>


    <!-- STEP 2 -->

    <div id="step2" class="step">

        <h3 class="step-title">
            Verify OTP
        </h3>

        <p class="note">
            Enter the OTP sent to your mobile number.
        </p>

        <form onsubmit="verifyOtp(event)">

            <label for="otp">
                OTP
            </label>

            <input
                type="text"
                id="otp"
                maxlength="6"
                inputmode="numeric"
                placeholder="Enter 6 digit OTP"
                required
            >

            <button type="submit">
                Verify OTP
            </button>

        </form>

    </div>


    <!-- STEP 3 -->

    <div id="step3" class="step">

        <h3 class="step-title">
            Set New Password
        </h3>

        <p class="note">
            Create a new password for your driver account.
        </p>

        <form onsubmit="changePassword(event)">

            <label for="newPassword">
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                required
            >

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                required
            >

            <button type="submit">
                Change Password
            </button>

        </form>

    </div>


    <div
        id="message"
        class="message">
    </div>


    <a
        href="/driver-login.html"
        class="back">
        ← Back to Driver Login
    </a>

</div>


<script>

    let mobileNumber = "";


    // -----------------------------------------
    // Show Message
    // -----------------------------------------

    function showMessage(text, success) {

        const message =
            document.getElementById("message");

        message.style.display = "block";

        message.textContent = text;

        if (success) {

            message.style.background = "#d1e7dd";
            message.style.color = "#0f5132";

        } else {

            message.style.background = "#f8d7da";
            message.style.color = "#842029";

        }
    }


    // -----------------------------------------
    // Show Step
    // -----------------------------------------

    function showStep(stepNumber) {

        document
            .querySelectorAll(".step")
            .forEach(function(step) {

                step.classList.remove("active");

            });


        document
            .getElementById("step" + stepNumber)
            .classList.add("active");

    }


    // -----------------------------------------
    // Generate OTP
    // -----------------------------------------

    async function generateOtp(event) {

        event.preventDefault();

        mobileNumber =
            document
                .getElementById("mobile")
                .value
                .trim();


        if (!/^[0-9]{10}$/.test(mobileNumber)) {

            showMessage(
                "Please enter a valid 10 digit mobile number.",
                false
            );

            return;
        }


        showMessage(
            "Sending OTP...",
            true
        );


        try {

            const url =
                "/api/driver-password-reset/generate" +
                "?mobile=" +
                encodeURIComponent(mobileNumber);


            const response =
                await fetch(url, {
                    method: "POST"
                });


            const result =
                await response.text();


            if (!response.ok) {

                showMessage(
                    result || "Unable to send OTP.",
                    false
                );

                return;
            }


            showMessage(
                "OTP generated successfully. Check your registered mobile.",
                true
            );


            showStep(2);


        } catch (error) {

            console.error(error);

            showMessage(
                "Unable to connect to the server.",
                false
            );

        }

    }


    // -----------------------------------------
    // Verify OTP
    // -----------------------------------------

    async function verifyOtp(event) {

        event.preventDefault();

        const otp =
            document
                .getElementById("otp")
                .value
                .trim();


        if (!/^[0-9]{6}$/.test(otp)) {

            showMessage(
                "Please enter a valid 6 digit OTP.",
                false
            );

            return;
        }


        showMessage(
            "Verifying OTP...",
            true
        );


        try {

            const url =
                "/api/driver-password-reset/verify" +
                "?mobile=" +
                encodeURIComponent(mobileNumber) +
                "&otp=" +
                encodeURIComponent(otp);


            const response =
                await fetch(url, {
                    method: "POST"
                });


            const result =
                await response.text();


            if (!response.ok) {

                showMessage(
                    result || "Invalid or expired OTP.",
                    false
                );

                return;
            }


            showMessage(
                "OTP verified successfully.",
                true
            );


            showStep(3);

        } catch (error) {

            console.error(error);

            showMessage(
                "Unable to connect to the server.",
                false
            );

        }

    }


    // -----------------------------------------
    // Change Password
    // -----------------------------------------

    async function changePassword(event) {

        event.preventDefault();

        const newPassword =
            document
                .getElementById("newPassword")
                .value;

        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;


        if (newPassword !== confirmPassword) {

            showMessage(
                "New password and confirm password do not match.",
                false
            );

            return;
        }


        if (newPassword.length < 6) {

            showMessage(
                "Password must contain at least 6 characters.",
                false
            );

            return;
        }


        showMessage(
            "Changing password...",
            true
        );


        try {

            const url =
                "/api/driver-password-reset/change-password" +
                "?mobile=" +
                encodeURIComponent(mobileNumber) +
                "&newPassword=" +
                encodeURIComponent(newPassword);


            const response =
                await fetch(url, {
                    method: "POST"
                });


            const result =
                await response.text();


            if (!response.ok) {

                showMessage(
                    result || "Unable to change password.",
                    false
                );

                return;
            }


            showMessage(
                "Password changed successfully. Redirecting to login...",
                true
            );


            setTimeout(function() {

                window.location.href =
                    "/driver-login.html";

            }, 1500);


        } catch (error) {

            console.error(error);

            showMessage(
                "Unable to connect to the server.",
                false
            );

        }

    }

</script>

</body>
</html>
