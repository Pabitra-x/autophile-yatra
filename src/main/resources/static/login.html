<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Login - Autophile Yatra</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        linear-gradient(
            rgba(0, 0, 0, 0.45),
            rgba(0, 0, 0, 0.45)
        ),
        url("/images/goa.jpg");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    padding: 20px;
}

.login-container {
    width: 420px;
    max-width: 95%;

    background: rgba(255, 255, 255, 0.97);

    padding: 35px;

    border-radius: 18px;

    box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.35);
}

.logo {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    color: #1769aa;
    margin-bottom: 8px;
}

.title {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    color: #333;
    margin-bottom: 28px;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    font-weight: bold;
    color: #333;
    margin-bottom: 8px;
}

input[type="text"],
input[type="password"] {
    width: 100%;
    padding: 13px;

    border: 1px solid #ccc;
    border-radius: 8px;

    font-size: 15px;
    outline: none;
}

input[type="text"]:focus,
input[type="password"]:focus {
    border-color: #1769aa;

    box-shadow:
        0 0 5px rgba(23, 105, 170, 0.3);
}

.password-container {
    width: 100%;
}

.show-password {
    display: flex;
    align-items: center;

    gap: 8px;

    margin-top: 9px;

    font-size: 14px;
    font-weight: normal;

    cursor: pointer;

    color: #555;
}

.show-password input {
    width: 16px;
    height: 16px;

    margin: 0;

    cursor: pointer;
}

.forgot-container {
    text-align: right;

    margin-top: 15px;
    margin-bottom: 20px;
}

.forgot-link {
    color: #1769aa;

    text-decoration: none;

    font-size: 14px;
    font-weight: bold;
}

.forgot-link:hover {
    text-decoration: underline;
}

.login-button {
    width: 100%;

    padding: 13px;

    border: none;
    border-radius: 8px;

    background: #1597d4;
    color: white;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;
}

.login-button:hover {
    background: #087eb5;
}

.login-button:disabled {
    background: #999;
    cursor: not-allowed;
}

#message {
    text-align: center;

    margin-top: 15px;

    min-height: 20px;

    font-weight: bold;
}

.register {
    text-align: center;

    margin-top: 25px;

    color: #555;
}

.register a {
    color: #1769aa;

    text-decoration: none;

    font-weight: bold;
}

.register a:hover {
    text-decoration: underline;
}

.home {
    text-align: center;

    margin-top: 18px;
}

.home a {
    color: #333;

    text-decoration: none;

    font-weight: bold;
}

.home a:hover {
    color: #1769aa;
}

</style>
</head>

<body>

<div class="login-container">

    <div class="logo">
        Autophile Yatra
    </div>

    <div class="title">
        Customer Login
    </div>

    <form id="loginForm">

        <!-- Mobile Number -->
        <div class="form-group">

            <label for="mobile">
                Mobile Number
            </label>

            <input
                type="text"
                id="mobile"
                maxlength="10"
                placeholder="Enter 10-digit mobile number"
                autocomplete="tel"
            >

        </div>

        <!-- Password -->
        <div class="form-group">

            <label for="password">
                Password
            </label>

            <div class="password-container">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >

                <label class="show-password">

                    <input
                        type="checkbox"
                        id="showPassword"
                    >

                    Show Password

                </label>

            </div>

        </div>

        <!-- Forgot Password -->
        <div class="forgot-container">

            <a
                href="/forgot-password.html?type=CUSTOMER"
                class="forgot-link"
            >
                Forgot Password?
            </a>

        </div>

        <!-- Login Button -->
        <button
            type="submit"
            id="loginButton"
            class="login-button"
        >
            Login
        </button>

    </form>

    <div id="message"></div>

    <!-- Register -->
    <div class="register">

        Don't have an account?

        <a href="/register.html">
            Register
        </a>

    </div>

    <!-- Home -->
    <div class="home">

        <a href="/index.html">
            Back to Home
        </a>

    </div>

</div>


<script>

/* =========================
   SHOW / HIDE PASSWORD
========================= */

document
    .getElementById("showPassword")
    .addEventListener("change", function () {

        const password =
            document.getElementById("password");

        if (this.checked) {

            password.type = "text";

        } else {

            password.type = "password";

        }

    });


/* =========================
   MOBILE NUMBER
========================= */

document
    .getElementById("mobile")
    .addEventListener("input", function () {

        this.value = this.value
            .replace(/\D/g, "")
            .slice(0, 10);

    });


/* =========================
   LOGIN FORM
========================= */

document
    .getElementById("loginForm")
    .addEventListener("submit", loginCustomer);


/* =========================
   CUSTOMER LOGIN
========================= */

async function loginCustomer(event) {

    event.preventDefault();

    const mobile =
        document
            .getElementById("mobile")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value;

    const message =
        document.getElementById("message");

    const loginButton =
        document.getElementById("loginButton");


    message.innerText = "";


    /* Mobile validation */

    if (mobile === "") {

        message.style.color = "red";

        message.innerText =
            "Please enter your mobile number.";

        return;
    }


    if (!/^[0-9]{10}$/.test(mobile)) {

        message.style.color = "red";

        message.innerText =
            "Please enter a valid 10-digit mobile number.";

        return;
    }


    /* Password validation */

    if (password === "") {

        message.style.color = "red";

        message.innerText =
            "Please enter your password.";

        return;
    }


    loginButton.disabled = true;

    loginButton.innerText = "Logging in...";


    try {

        const response = await fetch(
            `/api/customers/login?mobile=${encodeURIComponent(mobile)}&password=${encodeURIComponent(password)}`,
            {
                method: "POST"
            }
        );


        const result =
            await response.text();


        /* Successful login */

        if (
            result.startsWith("Login successful")
        ) {

            /*
             Backend response format:

             Login successful|1
            */

            const parts =
                result.split("|");

            const customerId =
                parts[1];


            if (!customerId) {

                message.style.color = "red";

                message.innerText =
                    "Login successful, but customer ID was not received.";

                loginButton.disabled = false;

                loginButton.innerText = "Login";

                return;
            }


            /* Save customer session */

            sessionStorage.setItem(
                "customerId",
                customerId
            );

            sessionStorage.setItem(
                "customerMobile",
                mobile
            );


            message.style.color = "green";

            message.innerText =
                "Login successful!";


            /* Go to dashboard */

            setTimeout(function () {

                window.location.href =
                    "/customer-dashboard.html";

            }, 1000);


        } else {

            /* Login failed */

            message.style.color = "red";

            message.innerText =
                result;

            loginButton.disabled = false;

            loginButton.innerText = "Login";
        }


    } catch (error) {

        console.error(error);

        message.style.color = "red";

        message.innerText =
            "Server error. Please try again.";

        loginButton.disabled = false;

        loginButton.innerText = "Login";
    }

}

</script>

</body>
</html>
