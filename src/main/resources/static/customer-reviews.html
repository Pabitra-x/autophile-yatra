<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Reviews - Autophile Yatra</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* ================= BODY ================= */

        body {
            min-height: 100vh;
            color: white;

            background-image:
                linear-gradient(
                    rgba(0,0,0,0.40),
                    rgba(0,0,0,0.40)
                ),
                url("/images/customer-dashboard-bg.png");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* ================= HEADER ================= */

        .header {
            background: rgba(0,0,0,0.45);

            backdrop-filter: blur(10px);

            color: white;

            padding: 18px 30px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            border-bottom:
                1px solid rgba(255,255,255,0.2);
        }

        .header h1 {
            font-size: 24px;
        }

        .back-btn {
            background: white;

            color: #0b3d91;

            border: none;

            padding: 10px 18px;

            border-radius: 20px;

            cursor: pointer;

            font-weight: bold;
        }

        .back-btn:hover {
            background: #e8f3ff;
        }

        /* ================= CONTAINER ================= */

        .container {
            width: 95%;

            max-width: 1100px;

            margin: 30px auto;
        }

        /* ================= BOXES ================= */

        .form-box,
        .reviews-box {
            background: rgba(255,255,255,0.94);

            color: #222;

            padding: 25px;

            border-radius: 18px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.25);

            margin-bottom: 25px;
        }

        h2 {
            color: #0b3d91;

            margin-bottom: 20px;
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;

            padding: 11px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;
        }

        input:focus,
        textarea:focus {
            outline: none;

            border-color: #0b3d91;
        }

        textarea {
            min-height: 120px;

            resize: vertical;
        }

        /* ================= RATING ================= */

        .rating-options {
            display: flex;

            gap: 15px;

            flex-wrap: wrap;

            margin-top: 8px;
        }

        .rating-options label {
            font-weight: normal;

            cursor: pointer;
        }

        .rating-options input {
            width: auto;

            margin-right: 5px;
        }

        /* ================= SUBMIT ================= */

        .submit-btn {
            background: #0b3d91;

            color: white;

            border: none;

            padding: 12px 22px;

            border-radius: 25px;

            cursor: pointer;

            font-size: 15px;

            font-weight: bold;
        }

        .submit-btn:hover {
            background: #082f70;

            transform: scale(1.02);
        }

        /* ================= MESSAGE ================= */

        .message {
            padding: 12px;

            border-radius: 6px;

            margin-bottom: 15px;

            display: none;
        }

        .success {
            background: #d4edda;

            color: #155724;
        }

        .error {
            background: #f8d7da;

            color: #721c24;
        }

        /* ================= REVIEW CARD ================= */

        .review-card {
            border: 1px solid #ddd;

            border-radius: 10px;

            padding: 18px;

            margin-bottom: 15px;

            background: #ffffff;
        }

        .review-card h3 {
            color: #0b3d91;

            margin-bottom: 10px;
        }

        .stars {
            color: #f5a623;

            font-size: 22px;

            margin: 8px 0;
        }

        .comment {
            background: #f4f7fb;

            padding: 12px;

            border-radius: 6px;

            margin-top: 10px;

            line-height: 1.5;
        }

        /* ================= EMPTY ================= */

        .no-data {
            text-align: center;

            padding: 25px;

            color: #666;
        }

        /* ================= LOADING ================= */

        .loading {
            text-align: center;

            padding: 25px;

            color: #555;
        }

        /* ================= FOOTER ================= */

        footer {
            text-align: center;

            margin-top: 45px;

            padding: 20px;

            background: rgba(0,0,0,0.40);

            font-size: 14px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            .header {
                padding: 15px;

                gap: 10px;
            }

            .header h1 {
                font-size: 18px;
            }

            .back-btn {
                padding: 8px 12px;

                font-size: 12px;
            }

            .container {
                width: 92%;
            }

            .rating-options {
                gap: 10px;
            }

        }

    </style>

</head>


<body>

    <!-- ================= HEADER ================= -->

    <div class="header">

        <h1>
            ⭐ My Reviews
        </h1>

        <button
            class="back-btn"
            onclick="goBack()">

            🏠 Back to Dashboard

        </button>

    </div>


    <!-- ================= MAIN ================= -->

    <div class="container">


        <!-- ================= REVIEW FORM ================= -->

        <div class="form-box">

            <h2>
                Submit Your Review
            </h2>


            <div
                id="message"
                class="message">
            </div>


            <form id="reviewForm">


                <!-- BOOKING ID -->

                <div class="form-group">

                    <label for="bookingId">
                        Booking ID
                    </label>

                    <input
                        type="number"
                        id="bookingId"
                        placeholder="Enter your completed booking ID"
                        required
                        min="1">

                </div>


                <!-- RATING -->

                <div class="form-group">

                    <label>
                        Rating
                    </label>


                    <div class="rating-options">


                        <label>

                            <input
                                type="radio"
                                name="rating"
                                value="1"
                                required>

                            1 ⭐

                        </label>


                        <label>

                            <input
                                type="radio"
                                name="rating"
                                value="2">

                            2 ⭐⭐

                        </label>


                        <label>

                            <input
                                type="radio"
                                name="rating"
                                value="3">

                            3 ⭐⭐⭐

                        </label>


                        <label>

                            <input
                                type="radio"
                                name="rating"
                                value="4">

                            4 ⭐⭐⭐⭐

                        </label>


                        <label>

                            <input
                                type="radio"
                                name="rating"
                                value="5">

                            5 ⭐⭐⭐⭐⭐

                        </label>

                    </div>

                </div>


                <!-- COMMENT -->

                <div class="form-group">

                    <label for="comment">
                        Your Feedback
                    </label>

                    <textarea
                        id="comment"
                        placeholder="Write your travel experience..."
                        required>
                    </textarea>

                </div>


                <button
                    type="submit"
                    class="submit-btn">

                    ⭐ Submit Review

                </button>

            </form>

        </div>



        <!-- ================= PREVIOUS REVIEWS ================= -->

        <div class="reviews-box">

            <h2>
                My Previous Reviews
            </h2>


            <div id="reviewsContainer">

                <div class="loading">

                    Loading reviews...

                </div>

            </div>

        </div>

    </div>



    <!-- ================= FOOTER ================= -->

    <footer>

        © 2026 Autophile Yatra.
        All Rights Reserved.

    </footer>



    <!-- ================= JAVASCRIPT ================= -->

    <script>

        /* ==========================================
           CUSTOMER LOGIN CHECK
        ========================================== */

        const customerId =
            sessionStorage.getItem("customerId");


        if (!customerId) {

            alert("Please login first.");

            window.location.href =
                "/login.html";

        }


        /* ==========================================
           BACK TO DASHBOARD
        ========================================== */

        function goBack() {

            window.location.href =
                "/customer-dashboard.html";

        }


        /* ==========================================
           SHOW MESSAGE
        ========================================== */

        function showMessage(
            message,
            type
        ) {

            const messageBox =
                document.getElementById(
                    "message"
                );


            messageBox.innerText =
                message;


            messageBox.className =
                "message " + type;


            messageBox.style.display =
                "block";


            setTimeout(
                function() {

                    messageBox.style.display =
                        "none";

                },
                3000
            );

        }


        /* ==========================================
           CREATE STAR RATING
        ========================================== */

        function createStars(rating) {

            let stars = "";

            const ratingNumber =
                Number(rating) || 0;


            for (
                let i = 1;
                i <= 5;
                i++
            ) {

                if (i <= ratingNumber) {

                    stars += "★";

                } else {

                    stars += "☆";

                }

            }


            return stars;

        }


        /* ==========================================
           ESCAPE HTML
        ========================================== */

        function escapeHtml(value) {

            return String(value)

                .replace(/&/g, "&amp;")

                .replace(/</g, "&lt;")

                .replace(/>/g, "&gt;")

                .replace(/"/g, "&quot;")

                .replace(/'/g, "&#039;");

        }


        /* ==========================================
           LOAD REVIEWS
        ========================================== */

        async function loadReviews() {

            const container =
                document.getElementById(
                    "reviewsContainer"
                );


            container.innerHTML = `

                <div class="loading">

                    Loading reviews...

                </div>

            `;


            try {

                const response =
                    await fetch(
                        "/api/reviews/customer/"
                        + customerId
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to load reviews"
                    );

                }


                const reviews =
                    await response.json();


                if (
                    !reviews ||
                    reviews.length === 0
                ) {

                    container.innerHTML = `

                        <div class="no-data">

                            ⭐ You have not submitted
                            any reviews yet.

                        </div>

                    `;

                    return;

                }


                let html = "";


                reviews.forEach(
                    function(review) {

                        html += `

                            <div class="review-card">

                                <h3>

                                    Booking #${
                                        review.bookingId ?? "-"
                                    }

                                </h3>


                                <div class="stars">

                                    ${
                                        createStars(
                                            review.rating
                                        )
                                    }

                                </div>


                                <p>

                                    <strong>
                                        Rating:
                                    </strong>

                                    ${
                                        review.rating ?? "-"
                                    }
                                    / 5

                                </p>


                                <div class="comment">

                                    <strong>
                                        Feedback:
                                    </strong>

                                    <br>

                                    ${
                                        escapeHtml(
                                            review.comment
                                            ?? "No comment"
                                        )
                                    }

                                </div>

                            </div>

                        `;

                    }
                );


                container.innerHTML =
                    html;


            } catch (error) {

                console.error(error);


                container.innerHTML = `

                    <div class="no-data">

                        ❌ Unable to load your reviews.

                    </div>

                `;

            }

        }


        /* ==========================================
           SUBMIT REVIEW
        ========================================== */

        document
            .getElementById("reviewForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const bookingId =
                        document
                            .getElementById(
                                "bookingId"
                            )
                            .value;


                    const ratingElement =
                        document.querySelector(
                            'input[name="rating"]:checked'
                        );


                    const comment =
                        document
                            .getElementById(
                                "comment"
                            )
                            .value
                            .trim();


                    if (!ratingElement) {

                        showMessage(
                            "Please select a rating.",
                            "error"
                        );

                        return;

                    }


                    if (!comment) {

                        showMessage(
                            "Please enter your feedback.",
                            "error"
                        );

                        return;

                    }


                    const rating =
                        Number(
                            ratingElement.value
                        );


                    const reviewData = {

                        customerId:
                            Number(customerId),

                        bookingId:
                            Number(bookingId),

                        rating:
                            rating,

                        comment:
                            comment

                    };


                    try {

                        const response =
                            await fetch(
                                "/api/reviews/add",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(
                                            reviewData
                                        )
                                }
                            );


                        if (!response.ok) {

                            throw new Error(
                                "Review submission failed"
                            );

                        }


                        showMessage(
                            "Review submitted successfully.",
                            "success"
                        );


                        document
                            .getElementById(
                                "reviewForm"
                            )
                            .reset();


                        loadReviews();


                    } catch (error) {

                        console.error(error);


                        showMessage(
                            "Failed to submit review.",
                            "error"
                        );

                    }

                }
            );


        /* ==========================================
           START
        ========================================== */

        loadReviews();

    </script>

</body>

</html>
