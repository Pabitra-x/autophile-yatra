<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Autophile Yatra</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.45),
                    rgba(0, 0, 0, 0.45)
                ),
                url("/images/goa.jpg");

            background-size: cover;

            background-position: center;

            padding: 20px;
        }


        .container {

            width: 420px;

            max-width: 95%;

            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.3);
        }


        .logo {

            text-align: center;

            font-size: 28px;

            font-weight: bold;

            color: #1769aa;

            margin-bottom: 8px;
        }


        .user-type {

            text-align: center;

            color: #666;

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 25px;
        }


        label {

            display: block;

            font-weight: bold;

            margin-bottom: 7px;
        }


        input {

            width: 100%;

            padding: 12px;

            border:
                1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;

            margin-bottom: 15px;

            outline: none;
        }


        input:focus {

            border-color: #1769aa;
        }


        button {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 7px;

            background: #1597d4;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }


        button:hover {

            background: #087eb5;
        }


        button:disabled {

            background: #999;

            cursor: not-allowed;
        }


        .hidden {

            display: none;
        }


        #message {

            text-align: center;

            margin-top: 15px;

            font-weight: bold;

            min-height: 20px;

            line-height: 1.5;
        }


        .success-message {

            color: green;
        }


        .error-message {

            color: red;
        }


        .back-login {

            text-align: center;

            margin-top: 20px;
        }


        .back-login a {

            color: #1769aa;

            text-decoration: none;

            font-weight: bold;
        }


        .back-login a:hover {

            text-decoration: underline;
        }


        .step-title {

            color: #1769aa;

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 15px;

            text-align: center;
        }


        .otp-info {

            text-align: center;

            color: #555;

            font-size: 14px;

            margin-bottom: 15px;
        }


        .password-note {

            color: #777;

            font-size: 13px;

            margin-top: -8px;

            margin-bottom: 15px;
        }


        @media (max-width: 500px) {

            .container {

                padding: 22px;

            }


            .logo {

                font-size: 24px;

            }


            .user-type {

                font-size: 17px;

            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- ================= LOGO ================= -->

        <div class="logo">

            Autophile Yatra

        </div>


        <!-- ================= USER TYPE ================= -->

        <div class="user-type"
             id="userTypeTitle">

            Forgot Password

        </div>



        <!-- =====================================================
             STEP 1
        ====================================================== -->

        <div id="step1">


            <div class="step-title">

                Step 1 - Verify Mobile Number

            </div>


            <label for="mobile">

                Mobile Number

            </label>


            <input
                type="text"
                id="mobile"
                maxlength="10"
                inputmode="numeric"
                autocomplete="tel"
                placeholder="Enter 10-digit mobile number">


            <button
                id="sendOtpButton"
                onclick="generateOtp()">

                Send OTP

            </button>

        </div>



        <!-- =====================================================
             STEP 2
        ====================================================== -->

        <div id="step2"
             class="hidden">


            <div class="step-title">

                Step 2 - Verify OTP

            </div>


            <div class="otp-info">

                Enter the 6-digit OTP sent to your mobile number.

            </div>


            <label for="otp">

                Enter 6-Digit OTP

            </label>


            <input
                type="text"
                id="otp"
                maxlength="6"
                inputmode="numeric"
                autocomplete="one-time-code"
                placeholder="Enter 6-digit OTP">


            <button
                id="verifyOtpButton"
                onclick="verifyOtp()">

                Verify OTP

            </button>

        </div>



        <!-- =====================================================
             STEP 3
        ====================================================== -->

        <div id="step3"
             class="hidden">


            <div class="step-title">

                Step 3 - Create New Password

            </div>


            <label for="newPassword">

                New Password

            </label>


            <input
                type="password"
                id="newPassword"
                autocomplete="new-password"
                placeholder="Enter new password">


            <div class="password-note">

                Password must contain at least 6 characters.

            </div>


            <label for="confirmPassword">

                Confirm Password

            </label>


            <input
                type="password"
                id="confirmPassword"
                autocomplete="new-password"
                placeholder="Confirm new password">


            <button
                id="changePasswordButton"
                onclick="changePassword()">

                Change Password

            </button>

        </div>



        <!-- ================= MESSAGE ================= -->

        <div id="message"></div>



        <!-- ================= BACK LOGIN ================= -->

        <div class="back-login">

            <a id="backLoginLink"
               href="/login.html">

                ← Back to Login

            </a>

        </div>


    </div>



    <script>


        /* =========================================================
           USER TYPE
           
           Customer:
           /forgot-password.html?type=CUSTOMER

           Admin:
           /forgot-password.html?type=ADMIN
        ========================================================= */


        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        let userType =
            urlParams.get("type");


        if (
            !userType ||
            (
                userType.toUpperCase() !== "CUSTOMER" &&
                userType.toUpperCase() !== "ADMIN"
            )
        ) {

            userType = "CUSTOMER";

        }


        userType =
            userType.toUpperCase();


        let mobileNumber = "";

        let otpVerified = false;



        /* =========================================================
           CHANGE PAGE TITLE
        ========================================================= */


        if (userType === "ADMIN") {

            document
                .getElementById("userTypeTitle")
                .innerText =
                "Admin Forgot Password";


            document
                .getElementById("backLoginLink")
                .href =
                "/admin-login.html";

        }
        else {

            document
                .getElementById("userTypeTitle")
                .innerText =
                "Customer Forgot Password";


            document
                .getElementById("backLoginLink")
                .href =
                "/login.html";

        }



        /* =========================================================
           GENERATE OTP
        ========================================================= */

        async function generateOtp() {

            const mobileInput =
                document.getElementById("mobile");


            mobileNumber =
                mobileInput.value.trim();


            const message =
                document.getElementById("message");


            /*
             * Validate mobile number.
             */

            if (
                !/^[0-9]{10}$/.test(
                    mobileNumber
                )
            ) {

                showMessage(
                    "Please enter a valid 10-digit mobile number.",
                    "error"
                );

                return;

            }


            const button =
                document.getElementById(
                    "sendOtpButton"
                );


            button.disabled = true;

            button.innerText =
                "Sending OTP...";


            clearMessage();


            try {


                /*
                 * Current backend endpoint:
                 *
                 * POST
                 * /api/password-reset/generate
                 */

                const response =
                    await fetch(
                        `/api/password-reset/generate?mobile=${encodeURIComponent(mobileNumber)}&userType=${encodeURIComponent(userType)}`,
                        {
                            method: "POST"
                        }
                    );


                const result =
                    await response.text();


                if (!response.ok) {

                    throw new Error(
                        result ||
                        "Unable to generate OTP."
                    );

                }


                /*
                 * OTP generated successfully.
                 */

                showMessage(
                    result ||
                    "OTP generated successfully.",
                    "success"
                );


                document
                    .getElementById("step1")
                    .classList.add("hidden");


                document
                    .getElementById("step2")
                    .classList.remove("hidden");


                document
                    .getElementById("otp")
                    .focus();


            }
            catch (error) {

                console.error(
                    "Generate OTP error:",
                    error
                );


                showMessage(
                    error.message ||
                    "Server error. Please try again.",
                    "error"
                );


                button.disabled = false;

                button.innerText =
                    "Send OTP";

            }

        }



        /* =========================================================
           VERIFY OTP
        ========================================================= */

        async function verifyOtp() {

            const otp =
                document
                    .getElementById("otp")
                    .value
                    .trim();


            const message =
                document.getElementById(
                    "message"
                );


            /*
             * Validate OTP.
             */

            if (
                !/^[0-9]{6}$/.test(otp)
            ) {

                showMessage(
                    "Please enter a valid 6-digit OTP.",
                    "error"
                );

                return;

            }


            const button =
                document.getElementById(
                    "verifyOtpButton"
                );


            button.disabled = true;

            button.innerText =
                "Verifying...";


            clearMessage();


            try {


                /*
                 * Current backend endpoint:
                 *
                 * POST
                 * /api/password-reset/verify
                 */

                const response =
                    await fetch(
                        `/api/password-reset/verify?mobile=${encodeURIComponent(mobileNumber)}&userType=${encodeURIComponent(userType)}&otp=${encodeURIComponent(otp)}`,
                        {
                            method: "POST"
                        }
                    );


                const result =
                    await response.text();


                if (!response.ok) {

                    throw new Error(
                        result ||
                        "OTP verification failed."
                    );

                }


                /*
                 * OTP verified.
                 */

                otpVerified = true;


                showMessage(
                    result ||
                    "OTP verified successfully.",
                    "success"
                );


                document
                    .getElementById("step2")
                    .classList.add("hidden");


                document
                    .getElementById("step3")
                    .classList.remove("hidden");


                document
                    .getElementById("newPassword")
                    .focus();


            }
            catch (error) {

                console.error(
                    "Verify OTP error:",
                    error
                );


                showMessage(
                    error.message ||
                    "Server error. Please try again.",
                    "error"
                );


                button.disabled = false;

                button.innerText =
                    "Verify OTP";

            }

        }



        /* =========================================================
           CHANGE PASSWORD
        ========================================================= */

        async function changePassword() {

            const newPassword =
                document
                    .getElementById("newPassword")
                    .value;


            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;


            /*
             * Make sure OTP was verified.
             */

            if (!otpVerified) {

                showMessage(
                    "Please verify OTP first.",
                    "error"
                );

                return;

            }


            /*
             * Password length.
             */

            if (
                newPassword.length < 6
            ) {

                showMessage(
                    "Password must contain at least 6 characters.",
                    "error"
                );

                return;

            }


            /*
             * Confirm password.
             */

            if (
                newPassword !==
                confirmPassword
            ) {

                showMessage(
                    "Passwords do not match.",
                    "error"
                );

                return;

            }


            const button =
                document.getElementById(
                    "changePasswordButton"
                );


            button.disabled = true;

            button.innerText =
                "Changing Password...";


            clearMessage();


            try {


                let url;


                /*
                 * Current backend endpoints:
                 *
                 * Customer:
                 * POST /api/password-reset/customer/change-password
                 *
                 * Admin:
                 * POST /api/password-reset/admin/change-password
                 */

                if (userType === "ADMIN") {

                    url =
                        `/api/password-reset/admin/change-password?mobile=${encodeURIComponent(mobileNumber)}&newPassword=${encodeURIComponent(newPassword)}`;

                }
                else {

                    url =
                        `/api/password-reset/customer/change-password?mobile=${encodeURIComponent(mobileNumber)}&newPassword=${encodeURIComponent(newPassword)}`;

                }


                const response =
                    await fetch(
                        url,
                        {
                            method: "POST"
                        }
                    );


                const result =
                    await response.text();


                if (!response.ok) {

                    throw new Error(
                        result ||
                        "Password change failed."
                    );

                }


                /*
                 * Password changed.
                 */

                showMessage(
                    result ||
                    "Password changed successfully! Redirecting...",
                    "success"
                );


                /*
                 * Disable the button so the
                 * request is not submitted again.
                 */

                button.disabled = true;


                /*
                 * Redirect to correct login page.
                 */

                setTimeout(
                    function () {

                        if (
                            userType === "ADMIN"
                        ) {

                            window.location.href =
                                "/admin-login.html";

                        }
                        else {

                            window.location.href =
                                "/login.html";

                        }

                    },
                    1500
                );


            }
            catch (error) {

                console.error(
                    "Change password error:",
                    error
                );


                showMessage(
                    error.message ||
                    "Server error. Please try again.",
                    "error"
                );


                button.disabled = false;

                button.innerText =
                    "Change Password";

            }

        }



        /* =========================================================
           SHOW MESSAGE
        ========================================================= */

        function showMessage(
            text,
            type
        ) {

            const message =
                document.getElementById(
                    "message"
                );


            message.innerText =
                text;


            message.className = "";


            if (type === "success") {

                message.classList.add(
                    "success-message"
                );

            }
            else {

                message.classList.add(
                    "error-message"
                );

            }

        }



        /* =========================================================
           CLEAR MESSAGE
        ========================================================= */

        function clearMessage() {

            const message =
                document.getElementById(
                    "message"
                );


            message.innerText = "";

            message.className = "";

        }



        /* =========================================================
           ONLY ALLOW NUMBERS IN MOBILE
        ========================================================= */

        document
            .getElementById("mobile")
            .addEventListener(
                "input",
                function () {

                    this.value =
                        this.value
                            .replace(
                                /[^0-9]/g,
                                ""
                            )
                            .slice(0, 10);

                }
            );



        /* =========================================================
           ONLY ALLOW NUMBERS IN OTP
        ========================================================= */

        document
            .getElementById("otp")
            .addEventListener(
                "input",
                function () {

                    this.value =
                        this.value
                            .replace(
                                /[^0-9]/g,
                                ""
                            )
                            .slice(0, 6);

                }
            );

    </script>


</body>

</html>
