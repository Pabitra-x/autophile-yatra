<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Driver Login - Autophile Yatra</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
        }

        .login-container {
            width: 400px;
            max-width: 92%;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #0b3d62;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 60px;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 12px;
            cursor: pointer;
            font-size: 13px;
            color: #0d6efd;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #0b3d62;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #082f4c;
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: 12px;
            margin-bottom: 18px;
            color: #0d6efd;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .back-btn {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 15px;
            padding: 12px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            display: none;
            background: #f8d7da;
            color: #842029;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Driver Login</h1>

        <p class="subtitle">
            Autophile Yatra
        </p>

        <form onsubmit="loginDriver(event)">

            <label for="mobile">
                Mobile Number
            </label>

            <input
                type="text"
                id="mobile"
                placeholder="Enter your mobile number"
                maxlength="10"
                inputmode="numeric"
                required
            >

            <label for="password">
                Password
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <span
                    class="show-password"
                    onclick="togglePassword()">
                    Show
                </span>

            </div>

            <a
                href="/driver-forgot-password.html"
                class="forgot">
                Forgot Password?
            </a>

            <button
                type="submit"
                class="login-btn">
                Login
            </button>

        </form>

        <div
            id="message"
            class="message">
        </div>

        <a
            href="/index.html"
            class="back-btn">
            Back Home
        </a>

    </div>


    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            const show =
                document.querySelector(".show-password");

            if (password.type === "password") {

                password.type = "text";
                show.textContent = "Hide";

            } else {

                password.type = "password";
                show.textContent = "Show";

            }
        }


        async function loginDriver(event) {

            event.preventDefault();

            const mobile =
                document.getElementById("mobile").value.trim();

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");


            message.style.display = "block";
            message.textContent = "Logging in...";


            try {

                const url =
                    "/api/drivers/login" +
                    "?mobile=" +
                    encodeURIComponent(mobile) +
                    "&password=" +
                    encodeURIComponent(password);


                const response =
                    await fetch(url, {
                        method: "POST"
                    });


                const result =
                    await response.text();


                if (!response.ok) {

                    message.textContent =
                        result || "Invalid mobile number or password.";

                    return;
                }


                const parts =
                    result.split("|");


                if (parts.length < 2) {

                    message.textContent =
                        "Invalid server response.";

                    return;
                }


                const driverId =
                    parts[1].trim();


                sessionStorage.setItem(
                    "driverId",
                    driverId
                );


                sessionStorage.setItem(
                    "driverLoggedIn",
                    "true"
                );


                message.style.background =
                    "#d1e7dd";

                message.style.color =
                    "#0f5132";

                message.textContent =
                    "Login successful. Opening dashboard...";


                setTimeout(function() {

                    window.location.href =
                        "/driver-dashboard.html";

                }, 500);


            } catch (error) {

                console.error(error);

                message.textContent =
                    "Unable to connect to the server.";

            }

        }

    </script>

</body>
</html>
